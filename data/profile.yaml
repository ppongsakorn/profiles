summaries:
  default:
    en: "Data & AI Team Lead building end-to-end, AI-first data operations that run all day, all night, with excellent output. Azure Databricks and Data Factory pipelines, Superset dashboards, fraud detection on AKS, AI agents on Microsoft Foundry, and tight control of cost and performance."
    th: "หัวหน้าทีม Data & AI ผู้สร้างงานข้อมูลแบบ AI-first ครบวงจร ทำงานได้ทั้งวันทั้งคืนด้วยผลลัพธ์ที่ยอดเยี่ยม ครอบคลุม pipeline บน Azure Databricks และ Data Factory, Dashboard ด้วย Superset, ระบบตรวจจับ Fraud บน AKS, AI Agent บน Microsoft Foundry และการควบคุมต้นทุนกับประสิทธิภาพ"
  data-platform:
    en: "Data & AI Team Lead running Azure Databricks and Azure Data Factory pipelines (Bronze to Silver to Gold) on Azure Data Lake, with automated quality gates that protect the SLA and cost control that starts with visibility, then tuning, then savings."
  ai:
    en: "Data & AI Team Lead running an AI-first operating model: Claude as the team's daily co-pilot, Databricks Genie for natural-language data access, AI agents on Microsoft Foundry for reporting, monitoring and alerting, and fraud detection with Python workers on AKS."

extra_tags: [leadership, software, teaching]

